[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tradeagent"
version = "0.7.0"
description = "Safety-first autonomous paper-trading agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Michael Abate" }]
dependencies = [
  "alembic>=1.16,<2",
  "exchange-calendars>=4.11,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.35,<1",
  "websockets>=15,<16",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.131,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6.1,<7",
  "ruff>=0.11,<1",
]

[project.scripts]
tradeagent = "tradeagent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tradeagent"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["tradeagent"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tradeagent"]

[[tool.mypy.overrides]]
module = ["exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.ruff]
extend-exclude = ["deep-research-report*.md"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
