services:
  tradeagent:
    build: .
    command:
      - tradeagent
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tradeagent-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  tradeagent-data:
